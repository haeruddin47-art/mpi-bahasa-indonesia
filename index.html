<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MPI Bahasa Indonesia Kelas VIII – SMP Negeri 8 Kolaka Utara</title>
<style>
:root{--bg:#fff7e6;--ink:#1d2433;--card:#ffffff;--a:#e8423f;--b:#1f6f8b;--c:#f2b705;--ok:#2e9e5b;--line:#e6dcc3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16202b;--ink:#f3ead7;--card:#223142;--line:#34475c}}
:root[data-theme="dark"]{--bg:#16202b;--ink:#f3ead7;--card:#223142;--line:#34475c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
#app{height:100%;max-width:900px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:3px solid var(--ink)}
header b{font-family:Impact,"Arial Black",sans-serif;font-weight:400;font-size:18px;letter-spacing:.5px;flex:1}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;box-shadow:3px 3px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.pri{background:var(--a);color:#fff}
main{flex:1;overflow-y:auto;padding:16px 14px}
h1,h2{font-family:Impact,"Arial Black",sans-serif;font-weight:400;margin:0 0 8px}
h1{font-size:clamp(34px,8vw,64px);line-height:1.02}
h2{font-size:26px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:14px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.menu button{padding:18px;font-size:18px;text-align:left}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-weight:700;font-size:14px}
.imp{background:var(--a);color:#fff}.per{background:var(--b);color:#fff}
.splash{text-align:center;padding-top:7vh}
.ad{background:var(--c);color:#1d2433;border:3px dashed #1d2433;border-radius:12px;padding:16px;font-size:20px;font-weight:700;text-align:center;margin:10px 0}
.opt{display:block;width:100%;text-align:left;margin:8px 0}
.opt.right{background:var(--ok);color:#fff}.opt.wrong{background:var(--a);color:#fff}
.fb{min-height:24px;font-weight:700;margin:6px 0}
textarea{width:100%;font:inherit;border:2px solid var(--ink);border-radius:10px;padding:8px;background:var(--card);color:var(--ink)}
.chip{display:inline-block;margin:4px;cursor:grab;user-select:none}
.zone{min-height:90px;border:3px dashed var(--ink);border-radius:12px;padding:8px;margin-bottom:10px}
.zone.imp{background:rgba(232,66,63,.12);color:inherit}.zone.per{background:rgba(31,111,139,.14);color:inherit}
nav{display:flex;gap:8px;padding:10px 14px;border-top:3px solid var(--ink)}
nav button{flex:1}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header><b>MPI BAHASA INDONESIA VIII</b><span id="sc" aria-live="polite"></span></header>
<main id="v"></main>
<nav id="nv" hidden>
<button data-g="menu">Menu</button><button data-g="materi">Materi</button><button data-g="sim">Simulasi</button><button data-g="kuis">Kuis</button><button data-g="profil">Profil</button>
</nav>
</div>
<script>
var v=document.getElementById('v'),nv=document.getElementById('nv'),sc=document.getElementById('sc');
var S={nama:'',skor:0,sim:0,done:false};
var ADS=[
["Beli sekarang sebelum kehabisan!","imp"],
["Rasakan kesegaran alami setiap hari.","per"],
["Cobalah sabun ini hari ini juga!","imp"],
["Dengan susu ini, tulangmu kuat dan tubuhmu sehat.","per"],
["Segera kunjungi toko kami!","imp"],
["Yuk, pilih sepatu yang nyaman untuk langkahmu!","per"]
];
var QZ=[
{q:"\"Jangan lewatkan diskon akhir pekan!\" termasuk kalimat...",o:["Imperatif (perintah/larangan)","Deklaratif biasa","Interogatif"],a:0,e:"Kata 'jangan' menandakan larangan, jadi imperatif."},
{q:"Manakah kalimat persuasif?",o:["Tutup pintunya!","Dengan madu ini, daya tahan tubuhmu terjaga dan harimu lebih bersemangat.","Ibu pergi ke pasar."],a:1,e:"Kalimat persuasif membujuk dengan alasan atau keunggulan."},
{q:"Slogan: \"Produk terbaik sedunia, pasti 100% sembuh!\" Apa kelemahannya?",o:["Terlalu pendek","Berlebihan dan tidak bisa dibuktikan","Tidak ada ajakan"],a:1,e:"Iklan yang baik jujur dan tidak melebih-lebihkan."}
];
var qi=0,locked=false;
function go(g){nv.hidden=(g==='splash');sc.textContent=S.nama?('Skor: '+S.skor):'';(R[g]||R.menu)()}
var R={
splash:function(){v.innerHTML='<div class="splash"><h1>AJAK &amp; BUJUK<br>DALAM IKLAN</h1><p>Media Pembelajaran Interaktif<br>Bahasa Indonesia Kelas VIII · Fase D<br><b>SMP Negeri 8 Kolaka Utara</b></p><div class="ad">"Mulai belajar sekarang!"</div><p><label>Nama kamu: <input id="nm" style="font:inherit;padding:6px;border:2px solid var(--ink);border-radius:8px;background:var(--card);color:var(--ink)"></label></p><button class="pri" id="st">Mulai</button></div>';
document.getElementById('st').onclick=function(){S.nama=document.getElementById('nm').value.trim()||'Siswa';go('menu')}},
menu:function(){v.innerHTML='<h2>Halo, '+esc(S.nama)+'!</h2><p>Pilih kegiatan belajarmu.</p><div class="grid menu"><button data-g="materi">📖 Materi<br><small>Pengertian dan ciri</small></button><button data-g="sim">🎯 Simulasi<br><small>Kelompokkan dan tulis iklan</small></button><button data-g="kuis">✏️ Kuis<br><small>3 soal berskor</small></button><button data-g="profil">👤 Profil<br><small>Tujuan dan skor</small></button></div>'},
materi:function(){v.innerHTML='<h2>Materi</h2><div class="card"><span class="tag imp">Imperatif</span><p><b>Kalimat imperatif</b> berisi perintah, larangan, ajakan, atau permintaan. Ciri: berakhiran tanda seru atau titik, memakai kata <i>ayo, mari, jangan, harap, cobalah, belilah</i>, dan sering diawali kata kerja.</p><p>Contoh: <i>Belilah sekarang!</i> · <i>Jangan lewatkan promo ini.</i></p></div><div class="card"><span class="tag per">Persuasif</span><p><b>Kalimat persuasif</b> bertujuan membujuk pembaca dengan alasan, manfaat, atau emosi, sehingga pembaca tertarik tanpa dipaksa. Ciri: ada keunggulan produk, bahasa menarik, dan sering memakai kata <i>kamu, yuk, dengan, agar</i>.</p><p>Contoh: <i>Dengan susu ini, tulangmu kuat dan tubuhmu sehat.</i></p></div><div class="card"><b>Tips:</b> Satu iklan sering memakai keduanya. Imperatif menyuruh bertindak, persuasif membuat orang mau bertindak.</div>'},
sim:function(){
var h='<h2>Simulasi</h2><div class="card"><b>Bagian A.</b> Seret (atau ketuk) tiap slogan, lalu ketuk kotak tujuan.<div id="pool"></div><p class="fb" id="fa">Pilih slogan dulu.</p></div><div class="zone imp" id="z0" data-t="imp"><b>Imperatif</b><div></div></div><div class="zone per" id="z1" data-t="per"><b>Persuasif</b><div></div></div>';
h+='<div class="card"><b>Bagian B.</b> Buat iklan untuk produk <b id="pr"></b>. Tulis satu kalimat imperatif dan satu kalimat persuasif.<textarea id="ta" rows="3" placeholder="Tulis iklanmu di sini..."></textarea><button class="pri" id="cek" style="margin-top:8px">Periksa</button><p class="fb" id="fb"></p></div>';
v.innerHTML=h;
var P=["Botol Minum Ramah Lingkungan","Madu Hutan Kolaka Utara","Tas Sekolah Anyaman"];document.getElementById('pr').textContent=P[Math.floor(Math.random()*P.length)];
var pool=document.getElementById('pool'),sel=null;
ADS.forEach(function(x,i){var b=document.createElement('button');b.className='chip';b.textContent=x[0];b.draggable=true;b.dataset.i=i;
b.onclick=function(){sel=b;document.getElementById('fa').textContent='Pilih kotak tujuan.'};
b.ondragstart=function(e){sel=b;e.dataTransfer.setData('text','x')};pool.appendChild(b)});
[0,1].forEach(function(k){var z=document.getElementById('z'+k);
function drop(){if(!sel)return;var ok=ADS[sel.dataset.i][1]===z.dataset.t;var fa=document.getElementById('fa');
if(ok){z.lastChild.appendChild(sel);sel.draggable=false;sel.onclick=null;S.skor+=10;S.sim++;fa.textContent='Benar! +10';fa.style.color='var(--ok)'}else{fa.textContent='Belum tepat. Cek ciri kalimatnya, lalu coba lagi.';fa.style.color='var(--a)'}
sel=null;if(S.sim>=6&&!pool.children.length){fa.textContent='Semua slogan sudah tepat!'}sc.textContent='Skor: '+S.skor}
z.onclick=drop;z.ondragover=function(e){e.preventDefault()};z.ondrop=function(e){e.preventDefault();drop()}});
document.getElementById('cek').onclick=function(){var t=document.getElementById('ta').value.toLowerCase(),f=document.getElementById('fb');
var im=/(ayo|mari|jangan|cobalah|belilah|segera|pilih|gunakan|rasakan|\b\w+lah\b|!)/.test(t),pe=/(dengan|agar|supaya|karena|sehingga|yuk|kamu|anda|nyaman|sehat|hemat|kuat)/.test(t);
if(t.length<15){f.textContent='Tulis minimal dua kalimat dulu.';return}
f.textContent=(im?'✔ Ada unsur imperatif. ':'✘ Tambahkan kata ajakan/perintah (ayo, cobalah, jangan). ')+(pe?'✔ Ada unsur persuasif.':'✘ Tambahkan alasan atau manfaat (dengan, agar, karena).');
if(im&&pe){S.skor+=10;sc.textContent='Skor: '+S.skor}}},
kuis:function(){qi=0;S.q=0;locked=false;q()},
profil:function(){v.innerHTML='<h2>Profil</h2><div class="card"><b>Nama:</b> '+esc(S.nama)+'<br><b>Skor:</b> '+S.skor+'</div><div class="card"><b>Capaian pembelajaran (Fase D):</b> peserta didik mengidentifikasi dan membuat kalimat imperatif serta persuasif yang umum digunakan dalam iklan.<br><br><b>Tujuan:</b><br>1. Menjelaskan pengertian dan ciri kalimat imperatif dan persuasif.<br>2. Mengidentifikasi keduanya dalam slogan iklan.<br>3. Menulis iklan yang jujur, santun, dan meyakinkan.</div><div class="card"><b>Mata Pelajaran:</b> Bahasa Indonesia, Kelas VIII<br><b>Sekolah:</b> SMP Negeri 8 Kolaka Utara<br><b>Pengembang:</b> Guru Bahasa Indonesia</div><div class="card"><b>Berpikir kritis:</b> Slogan "Pasti sembuh dalam sehari, beli sekarang!" Apakah ajakannya jujur? Tulis ulang dengan lebih santun dan meyakinkan.<textarea id="kr" rows="3"></textarea><button class="pri" id="kb" style="margin-top:8px">Periksa</button><p class="fb" id="kf"></p></div>';
document.getElementById('kb').onclick=function(){var t=document.getElementById('kr').value.toLowerCase();document.getElementById('kf').textContent=t.length<15?'Tulis ulang slogannya lebih lengkap.':(/pasti sembuh|100%|terbaik sedunia/.test(t)?'Masih ada klaim berlebihan. Hapus janji yang tidak bisa dibuktikan.':'Bagus! Iklanmu tidak berlebihan. Pastikan tetap ada ajakan dan alasan.')}}
};
function q(){var Q=QZ[qi];locked=false;
v.innerHTML='<h2>Kuis '+(qi+1)+'/3</h2><div class="bar"><i style="width:'+(qi/3*100)+'%"></i></div><div class="card" style="margin-top:12px"><p><b>'+Q.q+'</b></p><div id="op"></div><p class="fb" id="kfb"></p><button class="pri" id="nx" hidden>Lanjut</button></div>';
Q.o.forEach(function(t,i){var b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=function(){if(locked)return;locked=true;var ok=i===Q.a;b.classList.add(ok?'right':'wrong');if(!ok)document.getElementById('op').children[Q.a].classList.add('right');
if(ok){S.skor+=20;S.q++}document.getElementById('kfb').textContent=(ok?'Benar! +20. ':'Kurang tepat. ')+Q.e;sc.textContent='Skor: '+S.skor;var n=document.getElementById('nx');n.hidden=false;n.textContent=qi<2?'Lanjut':'Lihat hasil';n.onclick=function(){qi++;qi<3?q():hasil()}};document.getElementById('op').appendChild(b)})}
function hasil(){v.innerHTML='<div class="splash"><h2>Hasil Kuis</h2><div class="ad">'+S.q+' dari 3 benar</div><p>Total skor '+esc(S.nama)+': <b>'+S.skor+'</b></p><p>'+(S.q===3?'Luar biasa! Kamu siap membuat iklan sendiri.':'Pelajari lagi materinya, lalu ulangi kuis.')+'</p><button data-g="kuis">Ulangi</button> <button class="pri" data-g="menu">Ke menu</button></div>'}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
document.addEventListener('click',function(e){var b=e.target.closest('[data-g]');if(b)go(b.dataset.g)});
go('splash');
</script>
</body>
</html>
